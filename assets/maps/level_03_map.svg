<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="windGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Sunset Sky Background -->
  <rect width="1200" height="600" fill="url(#sunsetGrad)"/>

  <!-- Title & Coordinates -->
  <text x="40" y="45" font-family="monospace" font-size="20" font-weight="bold" fill="#fef08a">УРОВЕНЬ III: «ВЫСОТНЫЕ РАБОТЫ» — КРОВЛЯ И КРАН (ГРАНД-ФИНАЛ)</text>
  <text x="40" y="75" font-family="monospace" font-size="12" fill="#fed7aa">Высота: 28м-38м | Закатный свет | Вентиляторы, маятниковый кран и спасательная люлька</text>

  <!-- Rooftop Slab (Z: 0..25) -->
  <rect x="50" y="420" width="220" height="30" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="475" font-family="monospace" font-size="11" fill="#cbd5e1">Кровля (Y = 28м)</text>
  
  <!-- Narrow I-Beam (Z: 20..35) -->
  <rect x="270" y="425" width="120" height="12" fill="#b45309" stroke="#f59e0b" stroke-width="2"/>
  <text x="330" y="455" font-family="monospace" font-size="10" fill="#fef08a" text-anchor="middle">Узкая балка (1.2м)</text>

  <!-- Exhaust Fan & Wind Column -->
  <rect x="410" y="420" width="90" height="20" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="410,420 440,240 520,240 500,420" fill="url(#windGrad)"/>
  <text x="455" y="340" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">ВЕТЕР ➔➔</text>
  <text x="455" y="455" font-family="monospace" font-size="10" fill="#7dd3fc" text-anchor="middle">Вентилятор</text>

  <!-- Tower Crane Structure & Pendulum Load -->
  <line x1="620" y1="80" x2="620" y2="160" stroke="#eab308" stroke-width="8"/>
  <line x1="520" y1="160" x2="860" y2="160" stroke="#eab308" stroke-width="6"/>
  <text x="680" y="145" font-family="monospace" font-size="12" font-weight="bold" fill="#fef08a">Стрела Крана</text>

  <!-- Swinging Cable & Load -->
  <line x1="680" y1="160" x2="660" y2="320" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,2"/>
  <rect x="630" y="320" width="60" height="35" rx="4" fill="#64748b" stroke="#f8fafc" stroke-width="2"/>
  <text x="660" y="342" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">МАЯТНИК</text>
  <text x="660" y="375" font-family="monospace" font-size="9" fill="#facc15" text-anchor="middle">Груз крана ↔</text>

  <!-- Final Launch Ramp (Z: 75..95) -->
  <polygon points="760,400 900,350 900,370 760,420" fill="#b45309" stroke="#f59e0b" stroke-width="2"/>
  <text x="830" y="375" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ТРАМПЛИН ➔</text>

  <!-- Cradle & Worker (Z: 100..115) -->
  <rect x="1020" y="360" width="65" height="25" fill="#ea580c" stroke="#fed7aa" stroke-width="2"/>
  <circle cx="1050" cy="340" r="12" fill="#eab308" stroke="#ca8a04" stroke-width="3"/>
  <text x="1050" y="345" font-family="monospace" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">КАСКА</text>
  <text x="1050" y="405" font-family="monospace" font-size="10" font-weight="bold" fill="#ffedd5" text-anchor="middle">ЛЮЛЬКА</text>

  <!-- Safety Net Below Cradle -->
  <path d="M 980 470 Q 1060 520, 1140 470" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="6,4"/>
  <text x="1060" y="540" font-family="monospace" font-size="11" font-weight="bold" fill="#4ade80" text-anchor="middle">СТРАХОВОЧНАЯ СЕТКА</text>

  <!-- Trajectory Arc -->
  <path d="M 200 420 C 350 420, 420 300, 640 320 C 700 320, 780 400, 900 350 C 950 330, 1000 330, 1050 340" 
        fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,4"/>
</svg>