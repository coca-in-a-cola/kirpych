<svg width="1100" height="650" viewBox="0 0 1100 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="indGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="conveyorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="650" fill="url(#indGrad)"/>
  
  <!-- Title -->
  <text x="40" y="45" font-family="monospace" font-size="20" font-weight="bold" fill="#f8fafc">УРОВЕНЬ II: «НАРУШЕНИЕ ТБ» — ВЕРТИКАЛЬНЫЙ СРЕЗ (ELEVATION)</text>
  <text x="40" y="75" font-family="monospace" font-size="12" fill="#94a3b8">3 этажа монолита | Перепад высоты: 20м | Конвейеры, лифты, шахты и запертая дверь</text>

  <!-- Floors Slabs -->
  <!-- Floor 1 (Y=0) -->
  <rect x="50" y="550" width="320" height="20" fill="#475569" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="585" font-family="monospace" font-size="12" fill="#94a3b8">ЭТАЖ 1 (Y = 0м) — Цех погрузки</text>

  <!-- Conveyor on Floor 1 -->
  <rect x="120" y="535" width="220" height="15" rx="4" fill="url(#conveyorGrad)" stroke="#eab308" stroke-width="2"/>
  <text x="230" y="547" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">КОНВЕЙЕР (+16 м/с) ➔➔➔</text>

  <!-- Moving Lift Shaft -->
  <rect x="380" y="220" width="80" height="350" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="390" y="420" width="60" height="15" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <text x="420" y="410" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">ПОДЪЁМНИК ↕</text>
  <text x="420" y="590" font-family="monospace" font-size="10" fill="#ef4444" text-anchor="middle">Откат при падении</text>

  <!-- Floor 2 (Y=14) -->
  <rect x="500" y="320" width="240" height="20" fill="#475569" stroke="#64748b" stroke-width="2"/>
  <text x="510" y="355" font-family="monospace" font-size="12" fill="#94a3b8">ЭТАЖ 2 (Y = 14м) — Жёлоб</text>

  <!-- Concrete Chute on Floor 2 -->
  <polygon points="520,320 680,410 700,410 520,310" fill="#64748b" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="375" font-family="monospace" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Бетонный Жёлоб ➔</text>

  <!-- Floor 3 (Y=18) -->
  <rect x="780" y="200" width="280" height="20" fill="#475569" stroke="#64748b" stroke-width="2"/>
  <text x="790" y="235" font-family="monospace" font-size="12" fill="#94a3b8">ЭТАЖ 3 (Y = 18м) — Технический выход</text>

  <!-- Trajectory Arc -->
  <path d="M 340 535 C 380 480, 400 350, 520 315" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,4"/>
  <path d="M 700 410 C 740 410, 750 220, 800 200" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Heavy Metal Door at End -->
  <rect x="980" y="120" width="15" height="80" fill="#dc2626" stroke="#f87171" stroke-width="3"/>
  <text x="987" y="110" font-family="monospace" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">ЗАПЕРТАЯ ДВЕРЬ</text>
  <text x="987" y="225" font-family="monospace" font-size="10" fill="#fca5a5" text-anchor="middle">Порог: 35 км/ч</text>
  
  <!-- Worker Icon -->
  <circle cx="1030" cy="150" r="12" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
  <text x="1030" y="180" font-family="monospace" font-size="10" fill="#fef08a" text-anchor="middle">Строитель</text>
</svg>